<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuviko AI</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#10131c;color:white;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:600px;padding:22px;box-sizing:border-box;display:flex;flex-direction:column}
h1{color:#8b9cff;margin-bottom:4px}
.sub{color:#aab0c5}
#chat{flex:1;padding:15px 0;overflow:auto}
.msg{padding:12px 15px;border-radius:15px;margin:10px 0;white-space:pre-wrap;line-height:1.5}
.bot{background:#222838}
.user{background:#4557b9;margin-left:35px}
form{display:flex;gap:8px;margin:12px 0}
input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid #41485b;background:#1c2230;color:white;font-size:16px}
button{border:0;border-radius:12px;padding:12px 16px;background:#7788ff;color:white;font-weight:bold}
small{color:#aab0c5;text-align:center}
</style>
</head>
<body>
<div class="app">
<h1>✦ Nuviko AI</h1>
<div class="sub">Your friendly AI assistant</div>
<div id="chat">
<div class="msg bot">Namaste! 👋 Main Nuviko AI hoon.\nAbhi ye demo version hai. Mujhse kuch bhi pooch kar dekho!</div>
</div>
<form id="form">
<input id="prompt" placeholder="Yahan apna sawaal likho..." autocomplete="off" required>
<button>Send</button>
</form>
<small> Nuviko AI · First demo version</small>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('prompt');
document.getElementById('form').addEventListener('submit',function(e){
e.preventDefault();
const question=input.value.trim();
if(!question)return;
addMessage(question,'user');
input.value='';
addMessage('Main abhi demo mode mein hoon, isliye asli AI jawab dene ke liye mujhe AI service se connect karna hoga. Filhaal tumhari chat screen kaam kar rahi hai!','bot');
});
function addMessage(text,type){
const div=document.createElement('div');
div.className='msg '+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
  </html>
